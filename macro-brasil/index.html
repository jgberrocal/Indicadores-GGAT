:root{
  --marinho:#1F1F4C; --ciano:#009EC1; --lima:#C1CD23; --laranja:#F26B43; --ambar:#FBAE40;
  --verde:#36B393; --vermelho:#D2481F;
  --fundo:#F1F5F7; --superficie:#FFFFFF; --superficie-2:#F7FAFB;
  --tinta:#1F1F4C; --tinta-2:#5B6480; --tinta-3:#8E97AC;
  --linha:#E2E8ED; --linha-forte:#C3CCD6;
  --gradiente:linear-gradient(90deg,#03A0BF 0%,#36B393 38%,#7FCF52 72%,#B1E425 100%);
  --sans:'DM Sans Painel','DM Sans',Aptos,'Segoe UI',system-ui,-apple-system,sans-serif;
  --raio:4px;
  --sombra:0 1px 0 rgba(31,31,76,.03), 0 12px 28px -24px rgba(31,31,76,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--fundo);color:var(--tinta);font-family:var(--sans);font-size:15px;
  line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
:focus-visible{outline:2px solid var(--ciano);outline-offset:2px}
.faixa{height:4px;background:var(--gradiente)}

/* topo */
.topo{background:var(--superficie)}
.topo-linha{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:13px 24px 12px;max-width:1420px;margin:0 auto}
.logo{height:30px;width:auto;display:block}
.marca{display:flex;flex-direction:column;margin-right:auto;padding-left:18px;border-left:1px solid var(--linha)}
.marca h1{font-size:16px;margin:0;letter-spacing:-.01em;font-weight:700;color:var(--marinho)}
.marca .sub{font-size:11px;color:var(--tinta-3);letter-spacing:.06em;text-transform:uppercase}
.acoes{display:flex;gap:10px;align-items:center}
.acoes .sub{font-size:11px;color:var(--tinta-3);letter-spacing:.06em;text-transform:uppercase}
.btn{background:var(--superficie);border:1px solid var(--linha-forte);border-radius:var(--raio);
  padding:6px 11px;font-size:12.5px;color:var(--tinta-2);cursor:pointer;font-family:inherit}
.btn:hover{background:var(--superficie-2);border-color:var(--ciano);color:var(--ciano)}
.btn-voltar{display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
@media (max-width:640px){.btn-voltar span.rotulo{display:none}}

/* corpo */
.corpo{max-width:1420px;width:100%;margin:0 auto;padding:24px 24px 40px;flex:1}
.secao{margin-bottom:30px}
.secao-cab{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;
  margin:0 0 13px;padding-bottom:8px;border-bottom:1px solid var(--linha)}
.secao-cab h2{font-size:15px;margin:0;font-weight:700;color:var(--marinho);letter-spacing:-.01em}
.secao-cab .fonte{font-size:11px;color:var(--tinta-3);letter-spacing:.04em}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);
  box-shadow:var(--sombra);padding:0;overflow:hidden}
.kpi .tarja{height:3px;background:var(--ciano)}
.kpi[data-cor="lima"] .tarja{background:var(--lima)}
.kpi[data-cor="ambar"] .tarja{background:var(--ambar)}
.kpi[data-cor="laranja"] .tarja{background:var(--laranja)}
.kpi[data-cor="verde"] .tarja{background:var(--verde)}
.kpi .dentro{padding:13px 16px 15px}
.kpi .rotulo{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3);font-weight:700}
.kpi .valor{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:5px 0 2px;color:var(--marinho);
  font-variant-numeric:tabular-nums}
.kpi .valor.neg{color:var(--vermelho)}
.kpi .nota{font-size:12px;color:var(--tinta-2)}

/* cartões e tabelas */
.cartao{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);
  box-shadow:var(--sombra);padding:16px 18px 14px}
.grade-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grade-2{grid-template-columns:1fr}}
.cartao h3{margin:0 0 2px;font-size:13.5px;font-weight:700;color:var(--marinho)}
.cartao .legenda-txt{margin:0 0 10px;font-size:11.5px;color:var(--tinta-3)}

table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:right;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta-3);
  font-weight:700;padding:0 0 7px;border-bottom:1px solid var(--linha)}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:7px 0;border-bottom:1px solid var(--linha);color:var(--tinta-2)}
tbody tr:last-child td{border-bottom:0}
td:first-child{color:var(--tinta);font-weight:500}
td.destaque{color:var(--marinho);font-weight:700}
.seta-alta{color:var(--verde)}
.seta-baixa{color:var(--vermelho)}
.seta-est{color:var(--tinta-3)}

.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--tinta-2);margin-top:9px}
.legenda i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

svg{display:block;width:100%;height:auto;overflow:visible}
.graf{position:relative}
.tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  background:var(--marinho);color:#fff;border-radius:var(--raio);padding:9px 11px;
  font-size:12px;line-height:1.5;white-space:nowrap;z-index:5;
  box-shadow:0 8px 20px -10px rgba(31,31,76,.8);transition:opacity .1s ease}
.tip.on{opacity:1}
.tip .tref{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#9FD9E8;
  font-weight:700;margin-bottom:4px}
.tip .tl{display:flex;align-items:center;justify-content:space-between;gap:14px}
.tip .tl b{font-variant-numeric:tabular-nums;font-weight:700}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none;margin-right:6px}
.gx{stroke:var(--linha);stroke-width:1}
.rot{font-size:10px;fill:var(--tinta-3)}

.aviso{background:var(--superficie);border:1px solid var(--linha);border-left:3px solid var(--laranja);
  border-radius:var(--raio);padding:18px 20px;font-size:13.5px;color:var(--tinta-2)}
.aviso strong{color:var(--marinho)}
.aviso code{background:var(--superficie-2);padding:1px 5px;border-radius:3px;font-size:12.5px}

footer{background:var(--superficie);border-top:1px solid var(--linha)}
.rodape-linha{max-width:1420px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;
  gap:16px;flex-wrap:wrap;font-size:11px;color:var(--tinta-3);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:640px){
  .topo-linha{padding:12px 16px}
  .marca{padding-left:0;border-left:0;width:100%;margin-top:8px}
  .corpo{padding:20px 16px 32px}
  .rodape-linha{padding:14px 16px}
}
</style>
</head>

<script>
/* ============================ utilidades ============================ */
const MESES_ABR = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

function fmt(v, casas){
  if (v === null || v === undefined || isNaN(v)) return "–";
  return Number(v).toFixed(casas === undefined ? 2 : casas).replace(".", ",");
}
function rotuloRef(ref){
  const p = String(ref).split("-");
  return MESES_ABR[parseInt(p[1],10)-1] + "/" + p[0].slice(2);
}
function esc(t){
  return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ===================== desenho de gráficos (SVG) ==================== */
function escala(min, max, tam, pad){
  const amp = (max - min) || 1;
  return v => pad + (1 - (v - min) / amp) * (tam - 2 * pad);
}

function grafLinhas(cfg){
  /* cfg: {larg, alt, refs, series:[{nome,cor,valores,tracejado,area}], faixa:{teto,piso}} */
  const L = cfg.larg, A = cfg.alt, mE = 38, mD = 10, mT = 10, mB = 24;
  const n = cfg.refs.length;
  let todos = [];
  cfg.series.forEach(s => s.valores.forEach(v => { if (v !== null && !isNaN(v)) todos.push(v); }));
  if (cfg.faixa) cfg.faixa.teto.concat(cfg.faixa.piso).forEach(v => { if (v !== null) todos.push(v); });
  if (!todos.length) return "";
  let min = Math.min.apply(null, todos), max = Math.max.apply(null, todos);
  const folga = (max - min) * 0.12 || 1;
  min = min - folga; max = max + folga;

  const x = i => mE + (n <= 1 ? 0 : (i / (n - 1)) * (L - mE - mD));
  const y = v => mT + (1 - (v - min) / (max - min)) * (A - mT - mB);

  const uid = cfg.id || ("g" + Math.random().toString(36).slice(2, 8));
  let s = '<svg viewBox="0 0 ' + L + ' ' + A + '" preserveAspectRatio="none" role="img">';
  s += '<defs>' +
       '<linearGradient id="fx-' + uid + '" x1="0" y1="0" x2="1" y2="0">' +
         '<stop offset="0%" stop-color="#009EC1" stop-opacity=".16"/>' +
         '<stop offset="60%" stop-color="#36B393" stop-opacity=".13"/>' +
         '<stop offset="100%" stop-color="#C1CD23" stop-opacity=".16"/>' +
       '</linearGradient>' +
       '<linearGradient id="ar-' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
         '<stop offset="0%" stop-color="#1F1F4C" stop-opacity=".18"/>' +
         '<stop offset="100%" stop-color="#1F1F4C" stop-opacity="0"/>' +
       '</linearGradient>' +
       '</defs>';

  /* grade e rótulos do eixo Y */
  const passos = 4;
  for (let k = 0; k <= passos; k++){
    const v = min + (k / passos) * (max - min), yy = y(v);
    s += '<line class="gx" x1="' + mE + '" y1="' + yy + '" x2="' + (L - mD) + '" y2="' + yy + '"/>';
    s += '<text class="rot" x="' + (mE - 6) + '" y="' + (yy + 3) + '" text-anchor="end">' + fmt(v,1) + '</text>';
  }

  /* faixa de tolerância (meta) */
  if (cfg.faixa){
    let cima = "", baixo = "";
    for (let i = 0; i < n; i++){
      const t = cfg.faixa.teto[i], p = cfg.faixa.piso[i];
      if (t === null || p === null) continue;
      cima += (cima ? " L" : "M") + x(i) + " " + y(t);
      baixo = " L" + x(i) + " " + y(p) + baixo;
    }
    if (cima) s += '<path d="' + cima + baixo + ' Z" fill="url(#fx-' + uid + ')"/>';
  }

  /* séries */
  cfg.series.forEach(function(se){
    let d = "", aberto = false;
    for (let i = 0; i < n; i++){
      const v = se.valores[i];
      if (v === null || v === undefined || isNaN(v)) { aberto = false; continue; }
      d += (aberto ? " L" : " M") + x(i) + " " + y(v);
      aberto = true;
    }
    if (!d) return;
    if (se.area){
      let primeiro = null, ultimo = null;
      for (let i = 0; i < n; i++){
        const v = se.valores[i];
        if (v === null || v === undefined || isNaN(v)) continue;
        if (primeiro === null) primeiro = i;
        ultimo = i;
      }
      if (primeiro !== null && ultimo > primeiro){
        s += '<path d="' + d + ' L' + x(ultimo) + ' ' + y(min) + ' L' + x(primeiro) + ' ' +
             y(min) + ' Z" fill="url(#ar-' + uid + ')" stroke="none"/>';
      }
    }
    s += '<path d="' + d + '" fill="none" stroke="' + se.cor + '" stroke-width="' +
         (se.espessura || 2) + '" stroke-linejoin="round" stroke-linecap="round"' +
         (se.tracejado ? ' stroke-dasharray="5 4"' : '') + '/>';
  });

  /* linha do zero, quando a série tem valores negativos */
  const temZero = cfg.zero || cfg.series.some(function(se){ return se.zero; });
  if (temZero && min < 0 && max > 0){
    s += '<line x1="' + mE + '" y1="' + y(0) + '" x2="' + (L - mD) + '" y2="' + y(0) +
         '" stroke="#8E97AC" stroke-width="1"/>';
  }

  /* guia e pontos do tooltip */
  if (cfg.interativo){
    s += '<line class="guia" x1="0" y1="' + mT + '" x2="0" y2="' + (A - mB) +
         '" stroke="#8E97AC" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
    cfg.series.forEach(function(se, k){
      s += '<circle class="pt" data-s="' + k + '" r="3.5" fill="' + se.cor +
           '" stroke="#fff" stroke-width="1.5" opacity="0" cx="0" cy="0"/>';
    });
    s += '<rect class="captura" x="' + mE + '" y="' + mT + '" width="' + (L - mE - mD) +
         '" height="' + (A - mT - mB) + '" fill="transparent"/>';
  }

  /* rótulos do eixo X */
  const alvo = Math.max(1, Math.round(n / 8));
  for (let i = 0; i < n; i += alvo){
    s += '<text class="rot" x="' + x(i) + '" y="' + (A - 8) + '" text-anchor="middle">' +
         rotuloRef(cfg.refs[i]) + '</text>';
  }
  grafLinhas.ultimaGeo = {L:L, A:A, mE:mE, mD:mD, mT:mT, mB:mB, n:n, x:x, y:y};
  return s + '</svg>';
}

/* liga o tooltip a um gráfico de linhas já renderizado */
function ligarTooltip(idWrap, cfg, geo){
  const wrap = document.getElementById(idWrap);
  if (!wrap) return;
  const svg = wrap.querySelector("svg");
  const guia = wrap.querySelector(".guia");
  const pts = Array.prototype.slice.call(wrap.querySelectorAll(".pt"));
  const captura = wrap.querySelector(".captura");
  if (!svg || !captura) return;

  const tip = document.createElement("div");
  tip.className = "tip";
  wrap.appendChild(tip);

  function esconder(){
    tip.classList.remove("on");
    if (guia) guia.setAttribute("opacity", "0");
    pts.forEach(function(p){ p.setAttribute("opacity", "0"); });
  }

  function mover(ev){
    const cx = svg.getBoundingClientRect();
    if (!cx.width) return;
    const frac = (ev.clientX - cx.left) / cx.width;
    const uPlot = (frac * geo.L - geo.mE) / (geo.L - geo.mE - geo.mD);
    let i = Math.round(uPlot * (geo.n - 1));
    i = Math.max(0, Math.min(geo.n - 1, i));

    const px = geo.x(i);
    if (guia){
      guia.setAttribute("x1", px);
      guia.setAttribute("x2", px);
      guia.setAttribute("opacity", "1");
    }

    let corpo = '<div class="tref">' + rotuloRef(cfg.refs[i]) + '</div>';
    let algum = false, yRef = null;
    cfg.series.forEach(function(se, k){
      const v = se.valores[i];
      const p = pts[k];
      if (v === null || v === undefined || isNaN(v)){
        if (p) p.setAttribute("opacity", "0");
        return;
      }
      algum = true;
      if (yRef === null) yRef = geo.y(v);
      if (p){
        p.setAttribute("cx", px);
        p.setAttribute("cy", geo.y(v));
        p.setAttribute("opacity", "1");
      }
      corpo += '<div class="tl"><span><i style="background:' + se.cor + '"></i>' +
               esc(se.nome) + '</span><b>' + fmt(v) + '%</b></div>';
    });

    if (cfg.faixa && cfg.faixa.teto[i] !== null && cfg.faixa.teto[i] !== undefined &&
        cfg.faixa.piso[i] !== null && cfg.faixa.piso[i] !== undefined){
      corpo += '<div class="tl"><span><i style="background:#C3CCD6"></i>Tolerância</span><b>' +
               fmt(cfg.faixa.piso[i], 1) + " a " + fmt(cfg.faixa.teto[i], 1) + '%</b></div>';
    }

    if (!algum){ esconder(); return; }

    tip.innerHTML = corpo;
    tip.classList.add("on");
    const larguraCss = svg.clientWidth, alturaCss = svg.clientHeight;
    const pxCss = (px / geo.L) * larguraCss;
    const pyCss = ((yRef === null ? geo.A / 2 : yRef) / geo.A) * alturaCss;
    tip.style.left = Math.max(80, Math.min(larguraCss - 80, pxCss)) + "px";
    tip.style.top  = Math.max(tip.offsetHeight + 6, pyCss - 8) + "px";
  }

  captura.addEventListener("mousemove", mover);
  captura.addEventListener("mouseleave", esconder);
  captura.addEventListener("touchmove", function(e){
    if (e.touches && e.touches[0]) mover(e.touches[0]);
  }, {passive:true});
  captura.addEventListener("touchend", esconder);
}

function grafBarras(cfg){
  /* cfg: {larg, alt, refs, valores} — barras com zero destacado */
  const L = cfg.larg, A = cfg.alt, mE = 34, mD = 8, mT = 10, mB = 24;
  const n = cfg.valores.length;
  let min = Math.min.apply(null, cfg.valores.concat([0]));
  let max = Math.max.apply(null, cfg.valores.concat([0]));
  const folga = (max - min) * 0.15 || 1;
  min -= folga; max += folga;
  const y = v => mT + (1 - (v - min) / (max - min)) * (A - mT - mB);
  const larguraFaixa = (L - mE - mD) / n;
  const lb = Math.max(2, larguraFaixa * 0.62);

  let s = '<svg viewBox="0 0 ' + L + ' ' + A + '" preserveAspectRatio="none" role="img">';
  const passos = 4;
  for (let k = 0; k <= passos; k++){
    const v = min + (k / passos) * (max - min), yy = y(v);
    s += '<line class="gx" x1="' + mE + '" y1="' + yy + '" x2="' + (L - mD) + '" y2="' + yy + '"/>';
    s += '<text class="rot" x="' + (mE - 6) + '" y="' + (yy + 3) + '" text-anchor="end">' + fmt(v,1) + '</text>';
  }
  const y0 = y(0);
  s += '<line x1="' + mE + '" y1="' + y0 + '" x2="' + (L - mD) + '" y2="' + y0 +
       '" stroke="#C3CCD6" stroke-width="1"/>';

  cfg.valores.forEach(function(v, i){
    const cx = mE + larguraFaixa * (i + 0.5);
    const yv = y(v);
    const topo = Math.min(yv, y0), alt = Math.max(1, Math.abs(yv - y0));
    s += '<rect x="' + (cx - lb/2) + '" y="' + topo + '" width="' + lb + '" height="' + alt +
         '" fill="' + (v < 0 ? "#D2481F" : "#009EC1") + '" opacity=".88"><title>' +
         rotuloRef(cfg.refs[i]) + ": " + fmt(v) + '%</title></rect>';
  });

  const alvo = Math.max(1, Math.round(n / 8));
  for (let i = 0; i < n; i += alvo){
    s += '<text class="rot" x="' + (mE + larguraFaixa * (i + 0.5)) + '" y="' + (A - 8) +
         '" text-anchor="middle">' + rotuloRef(cfg.refs[i]) + '</text>';
  }
  return s + '</svg>';
}

/* ============================ montagem ============================= */
function kpi(rotulo, valor, nota, cor){
  const neg = (typeof valor === "number" && valor < 0) ? " neg" : "";
  const txt = (typeof valor === "number") ? fmt(valor) + "%" : valor;
  return '<div class="kpi" data-cor="' + cor + '"><div class="tarja"></div><div class="dentro">' +
    '<div class="rotulo">' + esc(rotulo) + '</div>' +
    '<div class="valor' + neg + '">' + txt + '</div>' +
    '<div class="nota">' + esc(nota) + '</div></div></div>';
}

function seta(c){
  if (c === "alta")  return '<span class="seta-alta">&#9650;</span>';
  if (c === "baixa") return '<span class="seta-baixa">&#9660;</span>';
  return '<span class="seta-est">=</span>';
}

function desenhar(d){
  const ipca = d.ipca, igpm = d.igpm, focus = d.focus;
  let h = "";

  document.getElementById("carimbo").textContent = "Atualizado em " + d.gerado_em;
  document.getElementById("fontes-rodape").textContent = "IBGE · BCB · FGV IBRE";

  /* ---- KPIs: IPCA (mês, ano, 12m) e IGP-M (mês, ano, 12m) ---- */
  const refIpca = rotuloRef(ipca.referencia);
  h += '<div class="secao"><div class="kpis">';
  h += kpi("IPCA — no mês", ipca.mes, refIpca, "ciano");
  h += kpi("IPCA — no ano", ipca.ano, "acumulado até " + refIpca, "ciano");
  h += kpi("IPCA — 12 meses", ipca.doze_meses, "até " + refIpca, "ciano");
  h += kpi("IGP-M — no mês", igpm.mes, "mês anterior: " + fmt(igpm.mes_anterior) + "%", "lima");
  h += kpi("IGP-M — no ano", igpm.ano, "acumulado até " + esc(igpm.mes_referencia), "lima");
  h += kpi("IGP-M — 12 meses", igpm.doze_meses, esc(igpm.mes_referencia), "lima");
  h += '</div></div>';

  /* ---- IPCA: 12 meses x meta  +  variação mensal, lado a lado ---- */
  const mf = d.meta_focus;
  const ult = ipca.serie.slice(-36);
  h += '<div class="secao">' +
       '<div class="secao-cab"><h2>IPCA</h2>' +
       '<span class="fonte">' + esc(d.fontes.ipca) + ' · ' + esc(d.fontes.bcb) + '</span></div>' +
       '<div class="grade-2">' +
         '<div class="cartao"><h3>Acumulado em 12 meses, meta e Focus</h3>' +
         '<p class="legenda-txt">Passe o cursor para ver os valores do mês</p>' +
         '<div class="graf" id="g-meta"></div>' +
         '<div class="legenda">' +
           '<span><i style="background:#1F1F4C"></i>IPCA ocorrido</span>' +
           '<span><i style="background:#009EC1"></i>Meta</span>' +
           '<span><i style="background:#F26B43"></i>Projeção Focus</span>' +
           '<span><i style="background:linear-gradient(90deg,#009EC1,#C1CD23);opacity:.4"></i>Tolerância</span>' +
         '</div></div>' +
         '<div class="cartao"><h3>Variação mensal</h3>' +
         '<p class="legenda-txt">Últimos 36 meses, em %</p>' +
         '<div class="graf" id="g-ipca-mes"></div></div>' +
       '</div></div>';

  /* ---- Selic, IBC-Br e PIB, quando vierem nos CSVs ---- */
  const temSelic = d.selic && d.selic.serie && d.selic.serie.length > 1;
  const temIbc   = d.ibcbr && d.ibcbr.serie && d.ibcbr.serie.length > 1;
  const temPib   = d.pib   && d.pib.serie   && d.pib.serie.length   > 1;
  if (temSelic || temIbc || temPib){
    h += '<div class="secao">' +
         '<div class="secao-cab"><h2>Juros e atividade</h2>' +
         '<span class="fonte">' + esc(d.fontes.bcb) + '</span></div>' +
         '<div class="grade-2">';
    if (temSelic) h += '<div class="cartao"><h3>Meta para a taxa Selic</h3>' +
      '<p class="legenda-txt">Em % a.a.</p><div class="graf" id="g-selic"></div></div>';
    if (temIbc) h += '<div class="cartao"><h3>IBC-Br — atividade econômica</h3>' +
      '<p class="legenda-txt">Variação % em 12 meses, dados mensais</p>' +
      '<div class="graf" id="g-ibcbr"></div></div>';
    if (temPib) h += '<div class="cartao"><h3>PIB</h3>' +
      '<p class="legenda-txt">Série do Banco Central</p><div class="graf" id="g-pib"></div></div>';
    h += '</div></div>';
  }

  /* ---- Focus ---- */
  h += '<div class="secao">' +
       '<div class="secao-cab"><h2>Expectativas de mercado — Boletim Focus</h2>' +
       '<span class="fonte">Mediana agregada · ' + esc(focus.data) + '</span></div>' +
       '<div class="cartao"><table><thead><tr><th>Indicador</th>';
  focus.anos.forEach(a => { h += '<th>' + esc(a) + '</th>'; });
  h += '</tr></thead><tbody>';
  focus.linhas.forEach(function(l){
    h += '<tr><td>' + esc(l.indicador) + '</td>';
    l.valores.forEach(function(v, i){
      h += '<td' + (i === 0 ? ' class="destaque"' : '') + '>' + fmt(v) +
           ' ' + seta(l.comp ? l.comp[i] : "estavel") + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';

  document.getElementById("corpo").innerHTML = h;

  /* ---- render dos gráficos ---- */
  const cfgMeta = {
    larg: 640, alt: 280, id: "meta", interativo: true,
    refs: mf.map(r => r.ref),
    faixa: {teto: preencher(mf.map(r => r.teto)), piso: preencher(mf.map(r => r.piso))},
    series: [
      {nome:"IPCA ocorrido", cor:"#1F1F4C", espessura:2.2, area:true, valores: mf.map(r => r.ocorrido)},
      {nome:"Meta",          cor:"#009EC1", espessura:1.8, valores: preencher(mf.map(r => r.meta))},
      {nome:"Focus",         cor:"#F26B43", espessura:2, tracejado:true, valores: mf.map(r => r.focus)}
    ]
  };
  document.getElementById("g-meta").innerHTML = grafLinhas(cfgMeta);
  ligarTooltip("g-meta", cfgMeta, grafLinhas.ultimaGeo);

  document.getElementById("g-ipca-mes").innerHTML = grafBarras({
    larg: 640, alt: 280, refs: ult.map(r => r.ref), valores: ult.map(r => r.mes)
  });

  if (temSelic){
    const s = d.selic.serie;
    const cfg = {larg:640, alt:240, id:"selic", interativo:true, refs:s.map(r => r[0]),
      series:[{nome:"Selic", cor:"#FBAE40", espessura:2.2, valores:s.map(r => r[1])}]};
    document.getElementById("g-selic").innerHTML = grafLinhas(cfg);
    ligarTooltip("g-selic", cfg, grafLinhas.ultimaGeo);
  }
  if (temIbc){
    const s = d.ibcbr.serie;
    const cfg = {larg:640, alt:240, id:"ibcbr", interativo:true, refs:s.map(r => r[0]),
      series:[{nome:"IBC-Br", cor:"#36B393", espessura:2.2, zero:true, valores:s.map(r => r[1])}]};
    document.getElementById("g-ibcbr").innerHTML = grafLinhas(cfg);
    ligarTooltip("g-ibcbr", cfg, grafLinhas.ultimaGeo);
  }
  if (temPib){
    const s = d.pib.serie;
    const cfg = {larg:640, alt:240, id:"pib", interativo:true, refs:s.map(r => r[0]),
      series:[{nome:"PIB", cor:"#009EC1", espessura:2.2, valores:s.map(r => r[1])}]};
    document.getElementById("g-pib").innerHTML = grafLinhas(cfg);
    ligarTooltip("g-pib", cfg, grafLinhas.ultimaGeo);
  }
}

/* repete o último valor conhecido — usado nas séries anuais (meta e bandas) */
function preencher(arr){
  let ultimo = null;
  return arr.map(function(v){
    if (v !== null && v !== undefined && !isNaN(v)) ultimo = v;
    return ultimo;
  });
}

function falhou(){
  document.getElementById("corpo").innerHTML =
    '<div class="aviso"><strong>Não consegui ler o arquivo <code>dados.json</code>.</strong><br><br>' +
    'Se você abriu este arquivo direto do computador, o navegador bloqueia a leitura por segurança — ' +
    'publique no GitHub Pages para ver o painel completo.<br><br>' +
    'Se já está publicado, verifique se o <code>dados.json</code> está na mesma pasta do ' +
    '<code>index.html</code> e se foi gerado pelo <code>atualizar_macro.py</code>.</div>';
}

fetch("dados.json", {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.json(); })
  .then(desenhar)
  .catch(falhou);
</script>
